<!DOCTYPE html>
<html>
<head>
  <title>Final Test - All Scripts</title>
</head>
<body>
  <h1>Testing All Modified Scripts</h1>
  <div id="spa-content" data-page="discover">
    <div id="cardsContainer"></div>
    <div class="selector-tab" data-tab="hot"></div>
    <div id="pageInfo"></div>
    <button id="prevBtn"></button>
    <button id="nextBtn"></button>
  </div>
  
  <script>
    console.log('=== Final Test: Loading all modified scripts ===');
    
    const scripts = [
      'js/discover.js',
      'js/profile.js', 
      'js/leaderboards.js'
    ];
    
    let loadedCount = 0;
    
    scripts.forEach((src) => {
      const script = document.createElement('script');
      script.src = 'http://localhost:3000/' + src;
      script.onload = () => {
        loadedCount++;
        console.log(`✓ ${src} loaded (${loadedCount}/${scripts.length})`);
        
        if (loadedCount === scripts.length) {
          console.log('\n=== Testing exposed functions ===');
          console.log('window.switchTab:', typeof window.switchTab);
          console.log('window.prevPage:', typeof window.prevPage);
          console.log('window.nextPage:', typeof window.nextPage);
          console.log('window.switchProfileTab:', typeof window.switchProfileTab);
          console.log('window.deleteLevel:', typeof window.deleteLevel);
          console.log('window.publishDraft:', typeof window.publishDraft);
          console.log('window.editDraft:', typeof window.editDraft);
          console.log('window.viewProfile:', typeof window.viewProfile);
          console.log('window.navigateInternal:', typeof window.navigateInternal);
          
          console.log('\n✓✓✓ SUCCESS! All scripts loaded without errors!');
          console.log('✓✓✓ All global functions are accessible!');
        }
      };
      script.onerror = (err) => {
        console.error(`✗ ${src} failed:`, err);
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
