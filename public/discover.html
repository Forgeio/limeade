<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - Limeade</title>
  <link rel="icon" type="image/png" href="graphics/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="/" class="site-brand">
        <img src="graphics/logo.png" alt="Limeade" class="site-logo">
      </a>
    </div>
    <div class="nav-center">
      <button class="nav-btn active" data-nav="discover" onclick="navigateTo('discover')">
        <svg class="icon"><use href="icons.svg#icon-public"/></svg>
        <span>Discover</span>
      </button>
      <button class="nav-btn" data-nav="leaderboards" onclick="navigateTo('leaderboards')">
        <svg class="icon"><use href="icons.svg#icon-leaderboard"/></svg>
        <span>Leaderboards</span>
      </button>
    </div>
    <div class="nav-right">
      <div class="user-section" id="userSection">
        <span class="user-name" id="userName">Guest User</span>
        <div class="user-avatar" id="userAvatar">GU</div>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item create" onclick="createLevel()">
            <svg class="icon"><use href="icons.svg#icon-add"/></svg>
            <span>Create</span>
          </button>
          <button class="dropdown-item" onclick="openProfile()">
            <svg class="icon"><use href="icons.svg#icon-person"/></svg>
            <span>Profile</span>
          </button>
          <button class="dropdown-item" onclick="openSettings()">
            <svg class="icon"><use href="icons.svg#icon-settings"/></svg>
            <span>Settings</span>
          </button>
          <button class="dropdown-item" onclick="logout()">
            <svg class="icon"><use href="icons.svg#icon-logout"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div id="spa-content" data-page="discover">
    <!-- Main Content -->
    <div class="main-content">
    <!-- Search + Filter -->
    <div class="discover-search-bar" id="discoverSearchBar">
      <div class="discover-search-input">
        <input type="text" id="discoverSearchInput" aria-label="Search levels">
        <div class="discover-search-actions">
          <button class="search-action-btn filter" id="discoverFilterBtn" aria-label="Sort" aria-haspopup="true" aria-expanded="false" aria-controls="discoverFilterMenu">
            <svg class="icon"><use href="icons.svg#icon-sort"/></svg>
          </button>
          <button class="search-action-btn" id="discoverSearchBtn" aria-label="Search">
            <svg class="icon"><use href="icons.svg#icon-search"/></svg>
          </button>
        </div>
      </div>
      <div class="filter-menu" id="discoverFilterMenu" role="menu">
        <button type="button" class="filter-option active" data-sort="likes">Sort by Likes</button>
        <button type="button" class="filter-option" data-sort="plays">Sort by Plays</button>
        <button type="button" class="filter-option" data-sort="clear_rate">Sort by Clear Rate</button>
        <button type="button" class="filter-option" data-sort="newest">Sort by Newest</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cardsContainer" class="cards-grid">
      <!-- Level cards will be dynamically inserted here -->
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="pagination-btn" id="prevBtn" onclick="prevPage()">
        <svg class="icon"><use href="icons.svg#icon-chevron-left"/></svg>
        <span>Previous</span>
      </button>
      <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
      <button class="pagination-btn" id="nextBtn" onclick="nextPage()">
        <span>Next</span>
        <svg class="icon"><use href="icons.svg#icon-chevron-right"/></svg>
      </button>
    </div>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/spa.js"></script>
  <script src="js/discover.js"></script>
</body>
</html>
