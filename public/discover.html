<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - Limeade</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation Bar Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Search and Filter Section -->
    <div class="search-filter-section">
      <div class="search-container-main">
        <svg class="icon"><use href="icons.svg#icon-search"/></svg>
        <input type="text" class="search-input-main" placeholder="Search levels..." id="searchInput">
        <button class="search-btn" id="searchBtn" onclick="performSearch()">
          <svg class="icon"><use href="icons.svg#icon-search"/></svg>
          <span>Search</span>
        </button>
      </div>
      <button class="filter-btn" id="filterBtn" onclick="toggleFilterMenu()">
        <svg class="icon"><use href="icons.svg#icon-filter"/></svg>
        <span>Filter</span>
      </button>
      
      <!-- Filter Menu -->
      <div class="filter-menu" id="filterMenu">
        <div class="filter-section">
          <h4 class="filter-title">Sort By</h4>
          <div class="filter-options">
            <label class="filter-option">
              <input type="radio" name="sort" value="hot" checked onchange="applyFilters()">
              <span>Hot (This Week)</span>
            </label>
            <label class="filter-option">
              <input type="radio" name="sort" value="top" onchange="applyFilters()">
              <span>Top (This Year)</span>
            </label>
            <label class="filter-option">
              <input type="radio" name="sort" value="new" onchange="applyFilters()">
              <span>New</span>
            </label>
            <label class="filter-option">
              <input type="radio" name="sort" value="likes" onchange="applyFilters()">
              <span>Most Likes</span>
            </label>
            <label class="filter-option">
              <input type="radio" name="sort" value="plays" onchange="applyFilters()">
              <span>Most Plays</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cardsContainer" class="cards-grid">
      <!-- Level cards will be dynamically inserted here -->
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="pagination-btn" id="prevBtn" onclick="prevPage()">
        <svg class="icon"><use href="icons.svg#icon-chevron-left"/></svg>
        <span>Previous</span>
      </button>
      <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
      <button class="pagination-btn" id="nextBtn" onclick="nextPage()">
        <span>Next</span>
        <svg class="icon"><use href="icons.svg#icon-chevron-right"/></svg>
      </button>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/discover.js"></script>
</body>
</html>
